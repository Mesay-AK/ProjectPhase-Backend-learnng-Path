services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: taskmanager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taskmanager-network

  hasura:
    image: hasura/graphql-engine:v2.40.0
    restart: always
    ports:
      - '8080:8080'
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://admin:admin@postgres:5432/taskmanager
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true'
      HASURA_GRAPHQL_DEV_MODE: 'true'
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
    depends_on:
      - postgres
    networks:
      - taskmanager-network

  backend:
    build: .
    container_name: taskmanager-backend
    restart: always
    ports:
      - "8081:8081" # Adjust port as needed
    environment:
      DATABASE_URL: postgres://admin:admin@postgres:5432/taskmanager
      HASURA_URL: http://hasura:8080
    depends_on:
      - postgres
      - hasura
    networks:
      - taskmanager-network
    volumes:
      - .:/app

volumes:
  postgres_data:

networks:
  taskmanager-network:
    driver: bridge
