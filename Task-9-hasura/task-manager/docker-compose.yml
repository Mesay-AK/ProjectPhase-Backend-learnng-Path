services:
  postgres:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: taskdb
    ports:
      - "5432:5432"  # Optional: only if you need to access the DB from outside Docker
    networks:
      - hasura-network

  hasura:
    image: hasura/graphql-engine:v2.33.0
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"  # Port mapping from Docker container to your localhost
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://admin:admin@postgres:5432/taskdb  # Correct connection URL
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: "mysecret"
    networks:
      - hasura-network

networks:
  hasura-network:
    driver: bridge
